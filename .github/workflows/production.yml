name: Production

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Promote to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Promotes the github release, promotes from the beta channel to production, updates the screenshots
        env:
          BITWARDEN_SERVER: self-hosted
          BITWARDEN_SELF_HOSTED_URL: ${{ secrets.BITWARDEN_SELF_HOSTED_URL }}
          BITWARDEN_EMAIL: ${{ secrets.BITWARDEN_CI_EMAIL }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_CI_PASSWORD }}
        run: >
          ./gradlew
          assertVersionWasNotPushInProductionYet
          createGithubRelease
          publishToPlayStoreProductionNormalRelease
          updatePlayStoreScreenshotsNormalRelease
          --stacktrace
