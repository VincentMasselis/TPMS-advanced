name: Production

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Promote to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Download secret files
        shell: bash
        env:
          BITWARDEN_SERVER: ${{ secrets.BITWARDEN_CI_SERVER }}
          BITWARDEN_EMAIL: ${{ secrets.BITWARDEN_CI_EMAIL }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_CI_PASSWORD }}
          BITWARDEN_ITEM: ${{ secrets.BITWARDEN_CI_ITEM }}
        run: ./gradlew downloadBitwardenSecretFiles

      - name: Promotes the github release, promotes from the beta channel to production, updates the screenshots
        run: >
          ./gradlew
          assertVersionWasNotPushInProductionYet
          createGithubRelease
          publishToPlayStoreProductionNormalRelease
          updatePlayStoreScreenshotsNormalRelease
          --stacktrace

  back-merge:
    name: Back-merge main into develop
    needs: promotion
    # A failed Play Store upload is retryable on its own; a silently-skipped back-merge would
    # permanently block the next release (assertDevelopContainsMain would fail forever), so it
    # must not be conditioned on the promotion job's outcome.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Open (or reuse) the back-merge pull request and enable merge-commit auto-merge
        run: ./gradlew openBackMergePullRequest --stacktrace
