name: Beta

on:
  push:
    branches:
      - release/*

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publish to beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Download secret files
        shell: bash
        env:
          BITWARDEN_SERVER: ${{ secrets.BITWARDEN_CI_SERVER }}
          BITWARDEN_EMAIL: ${{ secrets.BITWARDEN_CI_EMAIL }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_CI_PASSWORD }}
          BITWARDEN_ITEM: ${{ secrets.BITWARDEN_CI_ITEM }}
        run: ./gradlew downloadBitwardenSecretFiles

      - name: Publish to beta and create a github release
        run: >
          ./gradlew
          assertReleaseBranchIsValid
          build
          verifyPaparazzi
          createGithubPreRelease
          publishToPlayStoreBetaRelease
          --stacktrace
